name: data-product

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      # Databricks auth — OAuth M2M with a service principal is recommended.
      # HOST and CLIENT_ID aren't credentials, so they live as repo variables;
      # CLIENT_SECRET is the actual secret. PAT auth (DATABRICKS_TOKEN) still
      # works but is the older path; if you'd rather use a PAT, replace the
      # CLIENT_ID / CLIENT_SECRET lines with `DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}`.
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      ENTROPY_DATA_API_KEY: ${{ secrets.ENTROPY_DATA_API_KEY }}
      ENTROPY_DATA_HOST: "{{API_HOST}}"
      DATACONTRACT_DATABRICKS_TOKEN: ${{ secrets.DATACONTRACT_DATABRICKS_TOKEN }}
      # SQL warehouse path is not a credential — repo variable.
      DATACONTRACT_DATABRICKS_HTTP_PATH: ${{ vars.DATACONTRACT_DATABRICKS_HTTP_PATH }}

    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      - uses: astral-sh/setup-uv@v6

      - name: Sync Python deps
        # Installs entropy-data + datacontract-cli[all] (and other dev deps)
        # into the project's .venv at the versions pinned by uv.lock. All
        # `uv run …` invocations below use this venv.
        run: uv sync

      - name: Validate bundle
        run: databricks bundle validate --target prod

      - name: Deploy bundle
        # --auto-approve: non-interactive; CI cannot answer the "destructive change?" prompt.
        # --fail-on-active-runs: refuse to deploy if a job or pipeline is mid-run.
        run: databricks bundle deploy --target prod --auto-approve --fail-on-active-runs

      - name: Run Lakeflow pipeline
        run: databricks bundle run {{DATA_PRODUCT_ID}} --target prod

      - name: Emit lineage to Entropy Data
        # Builds an OpenLineage RunEvent from Unity Catalog lineage metadata
        # and POSTs it via `entropy-data lineage submit`. The Python script
        # reads `/api/2.0/lineage-tracking/{table,column}-lineage` to
        # determine which upstream columns are actually consumed and
        # subsets each input's schema facet accordingly, so the Lineage
        # panel shows only the relevant fields per input card.
        #
        # The REST API works on serverless and classic pipelines alike —
        # no Spark listener, no init script, no extra grants beyond what
        # the prod SP already has.
        #
        # Runs only here (CI / code-change path), not on the Lakeflow Job's
        # daily refresh — lineage edges change only when code or schema
        # changes, so daily re-emits would add no information.
        run: |
          python3 .github/scripts/emit_lineage.py \
            --data-product-id {{DATA_PRODUCT_ID}} \
            --output-port-name {{OUTPUT_PORT_NAME}} \
            --output-table {{CATALOG}}.{{SCHEMA}}.{{TABLE}} \
          | uv run entropy-data lineage submit \
              --file - \
              --data-product-id {{DATA_PRODUCT_ID}} \
              --output-port-name {{OUTPUT_PORT_NAME}}

      - name: Test data contract
        # The JSON output below feeds the next step's publish to Entropy Data.
        # `--output-format json` produces the datacontract-cli native shape
        # (runId, dataContractId, result, checks[], …) that the
        # `entropy-data test-results publish` verb consumes — NOT junit XML,
        # which the publish CLI cannot parse (it reads JSON or YAML only).
        run: |
          mkdir -p test-results
          uv run datacontract test {{CONTRACT_PATH}} \
            --server production \
            --logs \
            --output ./test-results/results.json \
            --output-format json

      - name: Publish test results to Entropy Data
        # Surfaces in the platform's Data Quality panel for the output-port
        # contract. CI is non-interactive — publish is unconditional here.
        # Local runs go through the `datacontract-test` skill's confirmation gate.
        if: always()
        run: uv run entropy-data test-results publish --file ./test-results/results.json

      - name: Publish data contract
        run: uv run entropy-data datacontracts put {{CONTRACT_ID}} --file {{CONTRACT_PATH}}

      - name: Publish data product
        run: uv run entropy-data dataproducts put {{DATA_PRODUCT_ID}} --file {{ODPS_FILE}}
