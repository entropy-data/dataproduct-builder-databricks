bundle:
  name: {{DATA_PRODUCT_ID}}

variables:
  catalog:
    description: Unity Catalog catalog the pipeline writes to.
    default: {{CATALOG}}
  schema:
    description: Unity Catalog schema the pipeline writes to.
    default: {{SCHEMA}}
  notifications_email:
    description: Email address for pipeline failure notifications (prod target only).
    default: <set-before-prod-deploy>

include:
  - resources/*.yml

# Tags applied to every resource in the bundle (job, pipeline) for cost
# attribution and discoverability in the Databricks UI.
presets:
  tags:
    data_product_id: {{DATA_PRODUCT_ID}}

# `workspace.host` is intentionally NOT set in this template — the Databricks
# CLI rejects `${DATABRICKS_HOST}` interpolation for `workspace.host`
# ("Interpolation is not supported for the field workspace.host"). Supply the
# workspace at deploy time via one of:
#   - DATABRICKS_HOST env var (recommended for one-off shells and CI), OR
#   - a .databrickscfg profile selected with `--profile <name>`, OR
#   - hardcode per target after init: `workspace.host: https://<workspace>.cloud.databricks.com`.

targets:
  # Dev target — picked by `databricks bundle deploy` with no --target flag.
  # `mode: development` injects: name prefix [dev <user>], dev tag,
  # pipelines `development: true`, all schedules paused, deployment lock off,
  # workspace.root_path scoped to the deploying user's home.
  #
  # Per-user schema override is required (not optional): Unity Catalog
  # enforces single-pipeline ownership of materialized views, so the dev
  # pipeline can't materialize at the same schema where the prod CI
  # pipeline owns the table. ${workspace.current_user.short_name} resolves
  # to the deploying user's slug so concurrent devs on the same team don't
  # collide. Matches the Databricks docs DAB example
  # (docs.databricks.com/aws/en/dev-tools/bundles/examples).
  dev:
    default: true
    mode: development
    variables:
      schema: ${workspace.current_user.short_name}_{{SCHEMA}}

  # Prod target — customize before first prod deploy. `mode: production`
  # validates that workspace paths are NOT user-scoped and that `run_as`
  # is set; the placeholder below will fail validation until you replace
  # it with a real service principal.
  #
  # Recommended CI auth: OAuth M2M with a service principal. Set in CI:
  #   DATABRICKS_HOST, DATABRICKS_CLIENT_ID, DATABRICKS_CLIENT_SECRET
  prod:
    mode: production
    workspace:
      # Either a shared bundle folder or the service principal's home — must
      # NOT start with /Workspace/Users/<your-personal-email>.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/prod
    run_as:
      # Service principal application id (UUID) or display name.
      service_principal_name: <fill-in-before-prod-deploy>
    presets:
      pipelines_development: false
      trigger_pause_status: UNPAUSED
      tags:
        env: prod
    # Failure notifications — overlaid on the base scheduled job only for prod.
    # Dev deploys deliberately have no `email_notifications` block (a blank
    # `notifications_email` would panic the Jobs API). Replace the variable's
    # default in `variables.notifications_email` above before the first prod
    # deploy.
    resources:
      jobs:
        {{DATA_PRODUCT_ID}}_scheduled:
          email_notifications:
            on_failure:
              - ${var.notifications_email}
