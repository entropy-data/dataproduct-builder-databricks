resources:
  jobs:
    {{DATA_PRODUCT_ID}}_scheduled:
      name: "{{DATA_PRODUCT_NAME}} — scheduled refresh"
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC
      tasks:
        - task_key: run_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.{{DATA_PRODUCT_ID}}.id}
            full_refresh: false
      # `email_notifications` is intentionally NOT set here — the Jobs API
      # rejects an empty-string entry in `on_failure`, so a blank
      # `notifications_email` variable would panic every dev deploy. The
      # prod target overlays this block in `../databricks.yml` once the
      # `notifications_email` variable has a real value.
