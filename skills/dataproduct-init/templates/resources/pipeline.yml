resources:
  pipelines:
    {{DATA_PRODUCT_ID}}:
      name: {{DATA_PRODUCT_NAME}}
      serverless: true
      catalog: ${var.catalog}
      schema: ${var.schema}
      libraries:
        # Each Python module listed explicitly — Lakeflow rejects non-.py / .sql
        # files in libraries, and `glob.include` cannot filter by extension.
        # `dataproduct-implement` appends entries here when it creates new
        # input-port `@dp.view` wrappers under `src/input_ports/`.
        - file:
            path: ../src/output_ports/v1/{{TABLE}}.py
      configuration:
        bundle.sourcePath: ${workspace.file_path}/src
